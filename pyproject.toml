[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "novel-engine"
version = "0.1.0"
description = "Canon-centric long-form fiction engine for Chinese web novels (DeepSeek-ready)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "novel-engine contributors" }]
keywords = ["novel", "fiction", "writing", "llm", "deepseek", "webnovel", "网文"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Chinese (Simplified)",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "openai>=1.30",
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "build>=1.2",
]

# 发布前把下面两行换成你的仓库地址（不填也能装，只是 PyPI 页面没有链接）
# [project.urls]
# Homepage = "https://github.com/<you>/novel-engine"
# Issues = "https://github.com/<you>/novel-engine/issues"

[project.scripts]
novel = "novel.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/novel"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/bench",
    "/skills",
    "/docs",
    "/scripts",
    "/README.md",
    "/LICENSE",
    "/.env.example",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
